# ============================
# アプリケーション起動設定
# ============================

# Webアプリケーション（REST API）のポート番号
server.port=8080


# ============================
# データベース接続設定
# ============================

# PostgreSQL の JDBC 接続URL
# - データベース名: ml_si_db
# - currentSchema=group_x を指定することで、JPAが自チームのスキーマを参照
#   ※ 自分のチームのスキーマ名（group_a 〜 group_e）に書き換えてください
spring.datasource.url=jdbc:postgresql://203.137.162.185:5432/ml_si_db?currentSchema=group_a

# DBユーザー名（自分のチームのユーザー名 user_group_a 〜 user_group_e に書き換えてください）
# ※ スキーマ名（currentSchema）とグループを揃えること
spring.datasource.username=user_group_a

# パスワード（環境変数 DB_PASSWORD から読み込み）
spring.datasource.password=${DB_PASSWORD:}

# JDBCドライバクラス名（明示的に指定）
spring.datasource.driver-class-name=org.postgresql.Driver

# DB接続の待ち時間（デフォルト30秒は長いため、接続失敗を5秒で検知する）
spring.datasource.hikari.connection-timeout=5000

# 1PCあたりのDB接続プール上限
# （デフォルト10のままだと15台同時起動でDBサーバーの接続上限を圧迫するため縮小）
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1


# ============================
# JPA（Hibernate）設定
# ============================

# テーブル自動作成などを無効化（none | validate | update | create など）
spring.jpa.hibernate.ddl-auto=none

# PostgreSQL 用の方言（SQL文の最適化設定）
# 起動時にDBへ接続せず方言を決定するため、明示指定が必須
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 起動時にJDBCメタデータを取得しない設定（DB未接続でも起動可能にする・起動高速化）
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false


# ============================
# 外部API設定
# ============================
# APIキーは環境変数から読み込みます（リポジトリにキーをコミットしないこと！）
# 設定方法はREADMEの「APIキーの設定（.envファイル）」を参照してください。

# Geminiエンドポイント
# ※ モデル名は開催前に最新の無料枠対象モデルを確認して差し替えること
#   （gemini-2.0-flash は2026年6月に廃止済み）
gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=

# GeminiApiKey（環境変数 GEMINI_API_KEY から読み込み）
gemini.apikey=${GEMINI_API_KEY:}

# Amivoiceエンドポイント（ログ保存なし・同期HTTP）
amivoice.endpoint=https://acp-api.amivoice.com/v1/nolog/recognize

# AmivoiceApiKey（環境変数 AMIVOICE_API_KEY から読み込み）
amivoice.apikey=${AMIVOICE_API_KEY:}
